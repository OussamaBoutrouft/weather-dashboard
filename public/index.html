<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌤️ Weather Dashboard</h1>
      <p>Real-time weather data for your favorite cities</p>
    </header>

    <div class="search-section">
      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name..."
        autocomplete="off"
      >
      <button id="searchBtn">Search</button>
      <select id="unitSelect">
        <option value="metric">Celsius (°C)</option>
        <option value="imperial">Fahrenheit (°F)</option>
      </select>
    </div>

    <div id="errorContainer" class="error-container" style="display: none;"></div>

    <div class="cards-grid" id="weatherCards"></div>

    <div class="forecast-section" id="forecastSection" style="display: none;">
      <h2>5-Day Forecast</h2>
      <div id="forecastContainer" class="forecast-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
